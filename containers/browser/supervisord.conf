; ==============================================================================
; GHOST v3 — Browser Container Supervisor Configuration
; ==============================================================================
; PURPOSE:  Manages the lifecycle of four background processes inside the
;           Browser Container. Supervisor acts as PID 1 (init) and ensures:
;
;           1. Ordered startup (Xvfb → x11vnc → noVNC → Tor Browser)
;           2. Automatic restart if any process crashes
;           3. Centralized logging to stdout/stderr for `docker logs`
;           4. Clean shutdown propagation when the container stops
;
; PROCESS PIPELINE:
;   Xvfb (Virtual Display :1)
;     └─→ x11vnc (VNC server captures display :1)
;          └─→ websockify/noVNC (WebSocket bridge on port 8081)
;     └─→ Tor Browser (renders GUI to display :1)
;
; The user opens http://localhost:8081 and sees the Tor Browser running
; inside the isolated container.
; ==============================================================================

; ------------------------------------------------------------------------------
; SECTION: supervisord (Global Daemon Configuration)
; ------------------------------------------------------------------------------
; nodaemon=true  — Run in foreground (required for Docker: PID 1 must not fork)
; user=root      — Supervisor itself runs as root to manage child processes
;                  (individual programs switch to ghost_browser where needed)
; logfile        — Disable log file (we stream to Docker's stdout/stderr)
; pidfile        — Standard PID file location
; ------------------------------------------------------------------------------
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ==============================================================================
; PROCESS 1: Xvfb — X Virtual Framebuffer
; ==============================================================================
; Creates a virtual display (:1) in memory at 1920x1080 resolution with
; 24-bit color depth. This is the "invisible monitor" that all GUI
; applications render to. Without this, there is no display for the
; Tor Browser to draw on.
;
; Flags:
;   -screen 0 1920x1080x24  — Screen 0, Full HD, 24-bit color
;   -ac                     — Disable access control (allow any local user)
;   +extension GLX          — Enable OpenGL extension (some sites need WebGL)
;   +render                 — Enable RENDER extension (font anti-aliasing)
;   -noreset                — Don't reset display when last client disconnects
;
; Priority 10 = starts FIRST. Everything depends on the display existing.
; ==============================================================================
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ==============================================================================
; PROCESS 2: x11vnc — VNC Server
; ==============================================================================
; Attaches to the virtual display (:1) created by Xvfb and serves it as a
; VNC (RFB protocol) stream on port 5901. This is the intermediary between
; the virtual framebuffer and the web-based viewer.
;
; Flags:
;   -display :1      — Connect to Xvfb's display
;   -forever         — Don't exit when the last VNC client disconnects
;   -nopw            — No VNC password (security handled by Docker network
;                      isolation — the ghost_net is internal-only)
;   -shared          — Allow multiple simultaneous viewers
;   -rfbport 5901    — Listen on port 5901 for VNC connections
;   -xkb             — Use XKEYBOARD extension (proper keyboard mapping)
;   -noxrecord       — Disable RECORD extension (reduces overhead)
;   -noxfixes        — Disable XFIXES extension (reduces overhead)
;   -noxdamage       — Disable DAMAGE extension (forces full-frame updates,
;                      more compatible with noVNC)
;
; Priority 20 = starts AFTER Xvfb. Needs the display to exist first.
; startsecs=3        — Wait 3 seconds before considering it "started"
;                      (gives Xvfb time to initialize)
; ==============================================================================
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -nopw -shared -rfbport 5901 -xkb -noxrecord -noxfixes -noxdamage
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ==============================================================================
; PROCESS 3: websockify / noVNC — HTML5 Web Interface
; ==============================================================================
; Bridges the gap between the user's web browser and the VNC server:
;
;   User's Browser (WebSocket on :8081)
;       ←→ websockify (protocol translation)
;           ←→ x11vnc (raw VNC/RFB on :5901)
;
; This allows viewing the Tor Browser desktop in ANY modern web browser
; without installing a native VNC client — just navigate to:
;     http://localhost:8081/vnc.html
;
; Flags:
;   --web /usr/share/novnc  — Serve the noVNC HTML/JS/CSS client files
;   8081                    — WebSocket listening port (external-facing)
;   localhost:5901          — Backend VNC server to connect to
;
; Port 8081 is used (not 8080) to avoid conflicts with the Workstation
; container which uses 8080 for its own noVNC instance.
;
; Priority 30 = starts AFTER x11vnc. Needs the VNC backend to exist.
; startsecs=3              — Grace period for websockify initialization
; ==============================================================================
[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 8081 localhost:5901
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ==============================================================================
; PROCESS 4: Tor Browser — The Actual Application
; ==============================================================================
; Launches the Tor Browser Bundle as the non-root 'ghost_browser' user.
; The browser renders its GUI to the Xvfb virtual display (:1).
;
; IMPORTANT SECURITY NOTES:
;   - user=ghost_browser   — Tor Browser REFUSES to run as root. This is a
;                            deliberate upstream security decision. If the
;                            browser is exploited, the attacker lands as an
;                            unprivileged user with no access to system files.
;   - --detach             — Required by the start-tor-browser launcher to
;                            run in the background
;   - environment          — DISPLAY=:1 tells GTK/Firefox where to render
;                          — HOME is set so Tor Browser finds its profile
;
; CONTAINER ISOLATION BENEFITS:
;   Even if an attacker escapes the browser sandbox, they are still trapped
;   inside this minimal container. There are:
;     ✗ No pentest tools (those are in the Workstation)
;     ✗ No host filesystem mounts (those are in the Workstation)
;     ✗ No Tor control port access (that's in the Gateway)
;     ✗ No package manager with dev tools (minimal Debian image)
;     ✗ No way to reach the internet except through Tor (routing handcuffs)
;
; Priority 40 = starts LAST. All display infrastructure must be ready.
; startsecs=5              — Tor Browser takes time to bootstrap its
;                            internal Tor circuit on first launch.
; startretries=5           — Retry up to 5 times if the browser fails to
;                            start (e.g., Xvfb not ready yet).
; ==============================================================================
[program:tor-browser]
command=/home/ghost_browser/tor-browser/Browser/start-tor-browser --detach
user=ghost_browser
autostart=true
autorestart=true
priority=40
startsecs=5
startretries=5
environment=DISPLAY=":1",HOME="/home/ghost_browser"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
